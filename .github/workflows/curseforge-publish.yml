name: Publish CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch or tag to build, for example main or v1.0.0
        required: true
        default: main
        type: string
      version:
        description: CurseForge release version, for example 2.1.0
        required: true
        default: 2.1.0
        type: string
      loader:
        description: Loader family when target is all
        required: true
        default: all
        type: choice
        options:
          - all
          - forge
          - fabric
          - neoforge
      target:
        description: Publish 2.1.0 targets or retry one exact Minecraft target
        required: true
        default: 2.1.0
        type: choice
        options:
          - 2.1.0
          - forge-1.19.2
          - forge-1.20.1
          - fabric-1.20.1
          - neoforge-1.21.1
          - neoforge-26.1.2
          - all

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.repository }}-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}

jobs:
  publish-forge:
    if: ${{ (github.event_name == 'release' && github.event.release.tag_name != 'v2.1.0' && github.event.release.tag_name != '2.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'all' && (inputs.loader == 'all' || inputs.loader == 'forge')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: forge-1.19.2
            branch: forge-1.19.2
            loader: forge
            minecraft: 1.19.2
            java: '17'
          - directory: forge-1.20.1
            branch: forge-1.20.1
            loader: forge
            minecraft: 1.20.1
            java: '17'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || matrix.branch }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build Forge mod
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -Pmod_version="$CURSEFORGE_VERSION"

      - name: Verify Forge artifact
        working-directory: ${{ matrix.directory }}
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="build/libs/ftb-quests-kubejs-${CURSEFORGE_VERSION}.jar"
          test -f "$expected"
          echo "CURSEFORGE_FILE=${{ matrix.directory }}/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build-curseforge-changelog.md
          test -s build-curseforge-changelog.md

      - name: Publish Forge file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: ftb-quests-kubejs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build-curseforge-changelog.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}

  publish-neoforge:
    if: ${{ (github.event_name == 'release' && github.event.release.tag_name != 'v2.1.0' && github.event.release.tag_name != '2.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'all' && (inputs.loader == 'all' || inputs.loader == 'neoforge')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: neoforge-1.21.1
            branch: neoforge-1.21.1
            loader: neoforge
            minecraft: 1.21.1
            java: '21'
          - directory: neoforge-1.26.1.2
            branch: neoforge-1.26.1.2
            loader: neoforge
            minecraft: 26.1.2
            java: '25'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || matrix.branch }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build NeoForge mod
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -Pmod_version="$CURSEFORGE_VERSION"

      - name: Verify NeoForge artifact
        working-directory: ${{ matrix.directory }}
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="build/libs/ftb-quests-kubejs-${CURSEFORGE_VERSION}.jar"
          test -f "$expected"
          echo "CURSEFORGE_FILE=${{ matrix.directory }}/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build-curseforge-changelog.md
          test -s build-curseforge-changelog.md

      - name: Publish NeoForge file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: ftb-quests-kubejs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build-curseforge-changelog.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}

  publish-fabric:
    if: ${{ (github.event_name == 'release' && github.event.release.tag_name != 'v2.1.0' && github.event.release.tag_name != '2.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'all' && (inputs.loader == 'all' || inputs.loader == 'fabric')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: fabric-1.20.1
            branch: fabric-1.20.1
            loader: fabric
            minecraft: 1.20.1
            java: '17'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || matrix.branch }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build Fabric mod
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -Pmod_version="$CURSEFORGE_VERSION"

      - name: Verify Fabric artifact
        working-directory: ${{ matrix.directory }}
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="build/libs/ftb-quests-kubejs-${CURSEFORGE_VERSION}.jar"
          test -f "$expected"
          echo "CURSEFORGE_FILE=${{ matrix.directory }}/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build-curseforge-changelog.md
          test -s build-curseforge-changelog.md

      - name: Publish Fabric file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: ftb-quests-kubejs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build-curseforge-changelog.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}

  prepare-selected-targets:
    if: ${{ (github.event_name == 'release' && (github.event.release.tag_name == 'v2.1.0' || github.event.release.tag_name == '2.1.0')) || (github.event_name == 'workflow_dispatch' && inputs.target != 'all') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            target="2.1.0"
          else
            target="$INPUT_TARGET"
          fi
          case "$target" in
            2.1.0)
              matrix='{"include":[{"directory":"forge-1.20.1","loader":"forge","minecraft":"1.20.1","java":"17"},{"directory":"neoforge-1.21.1","loader":"neoforge","minecraft":"1.21.1","java":"21"},{"directory":"neoforge-1.26.1.2","loader":"neoforge","minecraft":"26.1.2","java":"25"}]}'
              ;;
            forge-1.19.2)
              matrix='{"include":[{"directory":"forge-1.19.2","loader":"forge","minecraft":"1.19.2","java":"17"}]}'
              ;;
            forge-1.20.1)
              matrix='{"include":[{"directory":"forge-1.20.1","loader":"forge","minecraft":"1.20.1","java":"17"}]}'
              ;;
            fabric-1.20.1)
              matrix='{"include":[{"directory":"fabric-1.20.1","loader":"fabric","minecraft":"1.20.1","java":"17"}]}'
              ;;
            neoforge-1.21.1)
              matrix='{"include":[{"directory":"neoforge-1.21.1","loader":"neoforge","minecraft":"1.21.1","java":"21"}]}'
              ;;
            neoforge-26.1.2)
              matrix='{"include":[{"directory":"neoforge-1.26.1.2","loader":"neoforge","minecraft":"26.1.2","java":"25"}]}'
              ;;
            *)
              echo "Unsupported CurseForge target: $target" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish-selected-targets:
    name: Publish ${{ matrix.loader }} ${{ matrix.minecraft }}
    needs: prepare-selected-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-selected-targets.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build mod
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -Pmod_version="$CURSEFORGE_VERSION"

      - name: Verify artifact
        working-directory: ${{ matrix.directory }}
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="build/libs/ftb-quests-kubejs-${CURSEFORGE_VERSION}.jar"
          test -f "$expected"
          echo "CURSEFORGE_FILE=${{ matrix.directory }}/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build-curseforge-changelog.md
          test -s build-curseforge-changelog.md

      - name: Publish file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: ftb-quests-kubejs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build-curseforge-changelog.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
