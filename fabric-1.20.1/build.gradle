plugins {
    id "fabric-loom" version "1.6-SNAPSHOT"
    id "maven-publish"
}

group = project.maven_group
version = project.mod_version
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.ftb.dev/releases" }
    maven { name = "CurseMaven"; url = "https://cursemaven.com" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"

    modImplementation "curse.maven:ftb-library-438495:6164052"
    modImplementation "curse.maven:ftb-teams-438497:5267188"
    modImplementation "curse.maven:ftb-quests-438496:8078537"
    modImplementation "curse.maven:kubejs-238086:8020594"
    modImplementation "curse.maven:rhino-416294:4944324"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

jar {
    from("LICENSE") {
        rename { fileName -> "${fileName}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
